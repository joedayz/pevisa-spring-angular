server:
  port: 8080
  # Muestra el path completo en errores de validación
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: pevisa-repuestos

# Actuator: exponemos health e info (en producción restringirías esto)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

# Metadatos que aparecen en /actuator/info
info:
  app:
    name: PEVISA Repuestos API
    version: 1.0.0
    description: Backend de gestión de repuestos automotrices
