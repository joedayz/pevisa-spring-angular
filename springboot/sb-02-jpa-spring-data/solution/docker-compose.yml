services:

  postgres:
    image: postgres:16-alpine
    container_name: pevisa-postgres
    environment:
      POSTGRES_DB: pevisa_db
      POSTGRES_USER: pevisa
      POSTGRES_PASSWORD: pevisa123
    ports:
      - "5432:5432"
    volumes:
      # Los datos persisten entre reinicios del contenedor
      - pevisa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pevisa -d pevisa_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pevisa_pgdata:
