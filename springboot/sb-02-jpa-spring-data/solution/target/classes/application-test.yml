# Perfil activo durante los tests.
# H2 en modo PostgreSQL: compatible sin levantar Docker.
spring:
  datasource:
    url: jdbc:h2:mem:pevisa_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
