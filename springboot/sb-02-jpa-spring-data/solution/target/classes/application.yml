server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: pevisa-repuestos

  datasource:
    url: jdbc:postgresql://localhost:5432/pevisa_db
    username: pevisa
    password: pevisa123
    hikari:
      # Tamaño del pool de conexiones.
      # Regla: (núcleos_cpu * 2) + spindle_disks
      # Para desarrollo con 4 núcleos: (4*2)+1 = 9. Ponemos 10.
      maximum-pool-size: 10
      minimum-idle: 2
      # Tiempo máximo esperando una conexión del pool (ms)
      connection-timeout: 30000
      # Tiempo máximo que una conexión puede estar inactiva (ms)
      idle-timeout: 600000
      # Tiempo máximo de vida de una conexión (ms)
      max-lifetime: 1800000
      pool-name: PevisaHikariPool

  jpa:
    # validate: Hibernate verifica que el esquema coincide con las entidades.
    # NO crea ni altera tablas. El esquema lo gestiona Flyway (SB-04).
    # En desarrollo usamos create-drop para no necesitar Flyway aún.
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # Dialecto PostgreSQL para aprovechar tipos nativos (UUID, JSONB, etc.)
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # Agrupación de INSERTs: en lugar de 1 INSERT por fila, agrupa de a 50
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

info:
  app:
    name: PEVISA Repuestos API
    version: 2.0.0
    description: Backend con JPA + Spring Data
