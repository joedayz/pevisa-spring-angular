server:
  port: 8080

spring:
  application:
    name: pevisa-repuestos

  datasource:
    url: jdbc:postgresql://localhost:5432/pevisa_db
    username: pevisa
    password: pevisa123
    hikari:
      # Tamaño del pool de conexiones.
      # Regla: (núcleos_cpu * 2) + spindle_disks
      # Para desarrollo con 4 núcleos: (4*2)+1 = 9. Ponemos 10.
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: PevisaHikariPool

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
