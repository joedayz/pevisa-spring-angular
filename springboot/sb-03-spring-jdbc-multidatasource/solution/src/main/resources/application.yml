server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: pevisa-repuestos

  # ── Datasource principal (Postgres) ─────────────────────────────────────
  # Spring Boot auto-configura JPA, HikariCP y TransactionManager
  # a partir de este datasource cuando solo hay uno.
  # Al agregar un segundo datasource en SB-03 esa auto-configuración
  # deja de funcionar y debemos hacerla explícita (ver DataSourceConfig).
  datasource:
    url: jdbc:postgresql://localhost:5432/pevisa_db
    username: pevisa
    password: pevisa123
    hikari:
      pool-name: PevisaPrincipalPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
        order_inserts: true

  # ── Datasource legado (leído por DataSourceConfig, no por Spring Boot) ──
  # No usa el prefijo spring.datasource para evitar que Spring Boot
  # intente auto-configurarlo. DataSourceConfig lo lee manualmente.
  datasource-legado:
    url: jdbc:postgresql://localhost:5433/pevisa_legado
    username: legado
    password: legado123
    hikari:
      pool-name: PevisaLegadoPool
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

info:
  app:
    name: PEVISA Repuestos API
    version: 3.0.0
    description: Backend con JPA + Spring JDBC + múltiples datasources
