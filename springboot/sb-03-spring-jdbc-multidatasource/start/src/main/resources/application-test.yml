# Tests: ambos datasources apuntan a H2 en memoria con esquemas distintos.
spring:
  datasource:
    url: jdbc:h2:mem:pevisa_principal;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  # El datasource legado también apunta a H2 en tests
  datasource-legado:
    url: jdbc:h2:mem:pevisa_legado;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
