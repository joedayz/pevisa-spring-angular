server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: pevisa-repuestos

  datasource:
    url: jdbc:postgresql://localhost:5432/pevisa_db
    username: pevisa
    password: pevisa123
    hikari:
      pool-name: PevisaPrincipalPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      # ══════════════════════════════════════════════════════════════
      # CAMBIO CLAVE respecto a SB-01, SB-02, SB-03:
      #   Antes: ddl-auto: create-drop  → Hibernate crea/destruye tablas
      #   Ahora: ddl-auto: validate     → Hibernate SOLO verifica que
      #          el schema existente coincide con las entidades JPA.
      #          Si no coincide, lanza SchemaManagementException al arrancar.
      #
      # ¿Quién crea el schema ahora? Flyway.
      # ¿Cuándo lo crea? Antes de que Hibernate lo valide,
      #          en la fase de inicialización de Spring Boot.
      # ══════════════════════════════════════════════════════════════
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
        order_inserts: true

  # Flyway se configura automáticamente cuando detecta flyway-core en el classpath
  # y spring.datasource está definido.
  flyway:
    enabled: true
    # Ubicación de las migraciones (por defecto classpath:db/migration)
    locations: classpath:db/migration
    # Prefijo de versiones (por defecto V)
    sql-migration-prefix: V
    # Separador entre versión y descripción (por defecto __)
    sql-migration-separator: __
    # Extensión de los scripts (por defecto .sql)
    sql-migration-suffixes: .sql
    # Si la BD tiene objetos que Flyway no conoce, no falla — útil cuando
    # heredas una BD existente. En proyectos nuevos se puede omitir.
    baseline-on-migrate: false
    # En producción: false. En desarrollo puede ser útil.
    clean-disabled: true
    # Tabla donde Flyway registra las migraciones ejecutadas
    table: flyway_schema_history

  datasource-legado:
    url: jdbc:postgresql://localhost:5433/pevisa_legado
    username: legado
    password: legado123
    hikari:
      pool-name: PevisaLegadoPool
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000

management:
  endpoints:
    web:
      exposure:
        include: health,info,flyway
  endpoint:
    health:
      show-details: always

info:
  app:
    name: PEVISA Repuestos API
    version: 4.0.0
    description: Backend con Flyway migraciones
