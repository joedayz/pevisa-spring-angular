# Perfil de tests — H2 con Flyway habilitado.
# H2 ejecuta las mismas migraciones V1..V4 + R__ que Postgres.
# Esto garantiza que los tests prueban contra un schema idéntico al de producción.
#
# EXCEPCIÓN: V4 usa funciones PL/pgSQL (triggers) que H2 no soporta.
# Solución: una carpeta de migraciones alternativa para tests
# que omite las migraciones con SQL específico de Postgres.
# En SB-11 (Testcontainers) usamos Postgres real y esto desaparece.

spring:
  datasource:
    url: jdbc:h2:mem:pevisa_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: none   # Flyway es quien crea el schema, no Hibernate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: true
    locations: classpath:db/migration/test
    # En tests usamos una carpeta separada que solo tiene las migraciones
    # compatibles con H2 (sin PL/pgSQL, sin full-text Postgres)

  datasource-legado:
    url: jdbc:h2:mem:pevisa_legado_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
